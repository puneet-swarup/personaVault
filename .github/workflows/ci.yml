name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: personavault
          POSTGRES_USER: personavault
          POSTGRES_PASSWORD: personavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personavault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: personavault
      DB_PASSWORD: personavault

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run quality gate (mvn verify)
        run: mvn verify -B

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30