services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personavault-db
    environment:
      POSTGRES_DB: personavault
      POSTGRES_USER: ${DB_USER:-personavault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personavault}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-personavault}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:   