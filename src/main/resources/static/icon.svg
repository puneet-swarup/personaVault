<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PersonaVault">
  <title>PersonaVault</title>
  <defs>
    <linearGradient id="pv-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6a86ff"/>
      <stop offset="0.5" stop-color="#4a6cf7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pv-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="64" height="64" rx="15" fill="url(#pv-body)"/>
  <rect width="64" height="30" rx="15" fill="url(#pv-sheen)"/>

  <!-- vault door ring -->
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="2.2"/>

  <!-- dial ticks: reads as a vault door at larger sizes -->
  <g stroke="#ffffff" stroke-opacity="0.42" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="6.4" x2="32" y2="9.6"/>
    <line x1="32" y1="54.4" x2="32" y2="57.6"/>
    <line x1="6.4" y1="32" x2="9.6" y2="32"/>
    <line x1="54.4" y1="32" x2="57.6" y2="32"/>
  </g>

  <!-- the person at the centre of the vault -->
  <circle cx="32" cy="24.2" r="6.1" fill="#ffffff"/>
  <path d="M20.2 46.4c0-6.2 5.3-10.6 11.8-10.6s11.8 4.4 11.8 10.6z" fill="#ffffff"/>
</svg>
