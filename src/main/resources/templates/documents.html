<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Documents — PersonaVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-brand">PersonaVault</div>
    <div class="nav-links">
        <a th:href="@{/documents}" class="active">Documents</a>
        <a th:href="@{/chat}">Chat</a>
        <form th:action="@{/logout}" method="post" class="nav-logout">
            <button type="submit">Logout</button>
        </form>
    </div>
</nav>

<main class="content">
    <h1>Documents</h1>

    <div class="form-group" style="margin-bottom: 1rem;">
        <label for="category-select">Category</label>
        <select id="category-select">
            <option value="OTHER">Other</option>
            <option value="HEALTH_INSURANCE">Health Insurance</option>
            <option value="CAR_INSURANCE">Car Insurance</option>
            <option value="LIFE_INSURANCE">Life Insurance</option>
            <option value="HOME_INSURANCE">Home Insurance</option>
            <option value="TRAVEL_INSURANCE">Travel Insurance</option>
            <option value="FINANCIAL">Financial</option>
            <option value="MEDICAL">Medical</option>
            <option value="LEGAL">Legal</option>
            <option value="IDENTITY">Identity</option>
            <option value="EMPLOYMENT">Employment</option>
            <option value="EDUCATION">Education</option>
            <option value="REAL_ESTATE">Real Estate</option>
            <option value="FAMILY">Family</option>
            <option value="VEHICLE">Vehicle</option>
        </select>
    </div>

    <!-- Drag-drop upload zone -->
    <div id="drop-zone" class="drop-zone">
        <p class="drop-zone-text">
            <strong>Drag &amp; drop files here</strong><br/>
            or click to browse
        </p>
        <input type="file" id="file-input" multiple
               accept=".pdf,.docx,.xlsx,.csv,.png,.jpg,.jpeg,.txt" hidden/>
    </div>

    <!-- Upload progress area (populated by JS) -->
    <div id="upload-progress" class="upload-progress"></div>

    <!-- Document list -->
    <h2>Ingested Documents</h2>
    <table class="doc-table" id="doc-table">
        <thead>
        <tr>
            <th>File Name</th>
            <th>Type</th>
            <th>Size</th>
            <th>Chunks</th>
            <th>Ingested</th>
        </tr>
        </thead>
        <tbody>
        <!-- Populated by JS from GET /api/documents -->
        </tbody>
    </table>
</main>

<script th:src="@{/js/documents.js}"></script>
</body>
</html>
