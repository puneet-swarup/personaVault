<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — PersonaVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="login-body">
<div class="login-card">
    <h1>PersonaVault</h1>
    <p class="login-subtitle">Local-first document assistant</p>

    <!-- Spring Security CSRF token: required for form login -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus required/>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <!-- Show error if login failed -->
    <div th:if="${param.error}" class="login-error">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="login-success">
        You have been logged out.
    </div>
</div>
</body>
</html>
